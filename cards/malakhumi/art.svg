<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 228">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f2f9"/></linearGradient>
<pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#9a93c0" fill-opacity=".22"/></pattern>
</defs>
<style>
text{font-family:'Arial Rounded MT Bold','Trebuchet MS',Verdana,sans-serif;font-weight:bold}
.mono{font-family:Menlo,Monaco,Consolas,monospace}
.r{animation:gr 3s steps(1) infinite}.c{animation:gc 3s steps(1) infinite}
@keyframes gr{0%,74%,100%{transform:translate(-2.5px,0)}76%{transform:translate(-9px,2px)}79%{transform:translate(5px,-1px)}82%{transform:translate(-2.5px,0)}}
@keyframes gc{0%,74%,100%{transform:translate(2.5px,0)}76%{transform:translate(8px,-2px)}79%{transform:translate(-6px,1px)}82%{transform:translate(2.5px,0)}}
.bars rect{opacity:0;animation:bf 3s steps(1) infinite}
@keyframes bf{0%,75%,83%,100%{opacity:0}76%,80%{opacity:.9}}
.bar{animation:ld 6s ease-out infinite}
@keyframes ld{0%{width:0}60%,100%{width:150px}}
.pct{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:.25}}
.spin{transform-box:view-box;transform-origin:206px 20px;animation:sp 1.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.st{transform-origin:125px 74px;animation:wob 2.8s ease-in-out infinite}@keyframes wob{50%{transform:rotate(-6deg)}}
</style>
<rect width="250" height="228" fill="#e6e4f1"/>
<rect x="8" y="8" width="234" height="212" rx="12" fill="url(#bg)" stroke="#d3cfe4" stroke-width="1.5"/>
<path d="M8 20a12 12 0 0 1 12-12h210a12 12 0 0 1 12 12v12H8z" fill="#eeecf6"/>
<circle cx="21" cy="20" r="4" fill="#ff6b8a"/><circle cx="33" cy="20" r="4" fill="#ffc94d"/><circle cx="45" cy="20" r="4" fill="#5fd38d"/>
<g class="spin"><circle cx="206" cy="20" r="5" fill="none" stroke="#7c6cf2" stroke-width="2" stroke-dasharray="20 12" transform="translate(0 0)"/></g>
<rect x="8" y="32" width="234" height="188" fill="url(#dots)"/>
<g class="st">
<path d="M101 50h48a6 6 0 0 1 6 6v26l-14 14h-40a6 6 0 0 1-6-6V56a6 6 0 0 1 6-6z" fill="#fff" stroke="#c4bfdc" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M141 96V86a4 4 0 0 1 4-4h10" fill="#eeecf6" stroke="#c4bfdc" stroke-width="2"/>
<text x="125" y="78" font-size="16" text-anchor="middle">❓</text>
</g>
<g font-size="44" text-anchor="middle" class="mono">
<text class="r" x="125" y="146" fill="#ff3d8b" fill-opacity=".75">404</text>
<text class="c" x="125" y="146" fill="#33c3ff" fill-opacity=".75">404</text>
<text x="125" y="146" fill="#2e2a45">404</text>
</g>
<text x="125" y="166" font-size="12" fill="#2e2a45" text-anchor="middle">Sticker not found</text>
<text x="125" y="180" font-size="8.5" fill="#7a7596" text-anchor="middle" font-weight="normal">it may have been peeled off… 🥲</text>
<rect x="50" y="192" width="150" height="9" rx="4.5" fill="#fff" stroke="#d3cfe4"/>
<rect class="bar" x="50" y="192" width="150" height="9" rx="4.5" fill="#7c6cf2"/>
<text class="pct mono" x="125" y="213" font-size="8" fill="#6b5ce7" text-anchor="middle">loading… 99%</text>
<g class="bars"><rect x="8" y="118" width="234" height="4" fill="#33c3ff"/><rect x="40" y="138" width="170" height="3" fill="#ff3d8b"/><rect x="8" y="170" width="120" height="5" fill="#33c3ff"/></g>
</svg>
