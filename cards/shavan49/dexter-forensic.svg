<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <filter id="b" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#8B0000" flood-opacity=".85"/>
    </filter>
    <radialGradient id="s" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#9E050D" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#420003" stop-opacity=".98"/>
    </radialGradient>
  </defs>

  <!-- Miami Metro Forensic Evidence Framing & Crosshairs -->
  <g fill="none" stroke-linecap="round">
    <!-- Corner Crime-Scene Photo Crop Marks -->
    <path d="M12 10H38M12 10V36M228 10H202M228 10V36M12 230H38M12 230V204M228 230H202M228 230V204" stroke="#E8ECEF" stroke-width="1.6" stroke-opacity=".75"/>
    <!-- Forensic Millimeter Ruler Ticks (Left Edge) -->
    <path d="M12 52H20M12 62H17M12 72H20M12 82H17M12 92H22M12 102H17M12 112H20M12 122H17M12 132H22M12 142H17M12 152H20M12 162H17M12 172H20" stroke="#E8ECEF" stroke-width="1" stroke-opacity=".55"/>

    <!-- Blood-Spatter String Trajectory Lines & Origin Convergence Point -->
    <g stroke="#FF1E27" stroke-width=".95" stroke-opacity=".72" stroke-dasharray="4 3">
      <line x1="186" y1="184" x2="42" y2="38"/>
      <line x1="186" y1="184" x2="196" y2="44"/>
      <line x1="186" y1="184" x2="28" y2="148"/>
      <line x1="186" y1="184" x2="115" y2="22"/>
    </g>
    <!-- Point of Convergence Reticle -->
    <circle cx="186" cy="184" r="14" stroke="#00E5FF" stroke-width=".9" stroke-opacity=".65" stroke-dasharray="3 2"/>
    <circle cx="186" cy="184" r="6" stroke="#FF1E27" stroke-width="1.2" stroke-opacity=".85"/>
    <path d="M176 184H196M186 174V194" stroke="#00E5FF" stroke-width=".8" stroke-opacity=".7"/>

    <!-- Spatter Impact Angle Ellipses & Measurement Callouts -->
    <ellipse cx="42" cy="38" rx="6" ry="3.2" transform="rotate(42 42 38)" stroke="#00E5FF" stroke-width=".9" stroke-opacity=".75"/>
    <ellipse cx="196" cy="44" rx="5.5" ry="2.8" transform="rotate(-78 196 44)" stroke="#00E5FF" stroke-width=".9" stroke-opacity=".75"/>
  </g>

  <!-- Technical Forensic Telemetry & Case Annotations -->
  <g font-family="monospace" font-weight="700" letter-spacing=".8">
    <text x="18" y="21" fill="#E8ECEF" fill-opacity=".82" font-size="6.4">MMPD//LAB-04 · θ=34.2°</text>
    <text x="150" y="21" fill="#00E5FF" fill-opacity=".78" font-size="6.2">V₀=6.8m/s</text>
    <text x="18" y="224" fill="#FF2A2A" fill-opacity=".88" font-size="6.4">CASE# BHB-07-305</text>
  </g>

  <!-- Iconic Glass Blood Sample Slide (Bottom-Right Corner) -->
  <g transform="translate(142 194) rotate(-3)" filter="url(#b)">
    <rect x="0" y="0" width="78" height="28" rx="2" fill="#E8F4F8" fill-opacity=".18" stroke="#D0E4EC" stroke-width="1.1" stroke-opacity=".75"/>
    <rect x="3" y="3" width="18" height="22" fill="#F4F1EA" fill-opacity=".82"/>
    <text x="5" y="13" fill="#181A1C" font-family="monospace" font-weight="700" font-size="5.2">#047</text>
    <text x="5" y="21" fill="#8B0000" font-family="monospace" font-weight="700" font-size="4.6">MORGAN</text>
    <!-- Cover Slip & Blood Drop Inside Slide -->
    <rect x="29" y="4" width="26" height="20" fill="#FFFFFF" fill-opacity=".09" stroke="#E0F0F5" stroke-width=".6" stroke-opacity=".55"/>
    <circle cx="42" cy="14" r="6.8" fill="url(#s)"/>
    <circle cx="39.8" cy="11.8" r="1.6" fill="#FF9A9A" fill-opacity=".55"/>
    <!-- Glass Specular Highlight -->
    <path d="M24 2L36 26M60 2L72 26" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity=".28"/>
  </g>


  <!-- Realistic Arterial Blood Spatter Droplets Along Outer Edges -->
  <g fill="url(#s)" filter="url(#b)">
    <circle cx="212" cy="84" r="4.2"/>
    <path d="M212 88 C210 96, 214 102, 212 108 C211 102, 213 94, 212 88 Z"/>
    <circle cx="218" cy="96" r="1.8"/>
    <circle cx="205" cy="76" r="1.4"/>
    <circle cx="26" cy="182" r="3.6"/>
    <circle cx="33" cy="190" r="1.6"/>
    <circle cx="21" cy="173" r="1.2"/>
  </g>
</svg>
